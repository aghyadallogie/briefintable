<div class="max-w-3xl mx-auto p-6 mt-10">
    <a href="/briefings" class="text-indigo-600 hover:underline mb-4 inline-block">&larr; Back to Briefings</a>
    
    <h1 class="text-4xl font-bold mb-4">{{ title }}</h1>
    
    <div class="text-sm text-gray-500 mb-8 border-b pb-4">
        Written by {{ author:name }} on {{ created_at format="F j, Y" }}
    </div>

    <div class="prose prose-lg max-w-none">
        {{ content }}
    </div>
</div>
